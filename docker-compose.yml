x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://files:files@postgres:5432/files
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: files
  ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
  SCANNER: ${SCANNER:-noop}
  CLAMAV_HOST: clamav

x-app-depends: &app-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully

services:
  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: *app-env
    ports: ["8000:8000"]
    depends_on: *app-depends

  worker:
    build: .
    command: arq app.worker.WorkerSettings
    environment: *app-env
    depends_on:
      <<: *app-depends
      api:
        condition: service_started  # api runs the migrations

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: files
      POSTGRES_PASSWORD: files
      POSTGRES_DB: files
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U files"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb --ignore-existing local/files"

  # Opt in with:  SCANNER=clamav docker compose --profile scan up
  # First start downloads virus definitions and takes a minute or two.
  clamav:
    image: clamav/clamav:stable
    profiles: [scan]
    ports: ["3310:3310"]

volumes:
  pgdata:
  miniodata:
